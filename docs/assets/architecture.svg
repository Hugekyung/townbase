<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="1060" height="720" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>townbase v0.2 구성 아키텍처</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DB2777"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="720" fill="#ffffff"/>

  <!-- Docker Compose 경계 -->
  <rect x="24" y="100" width="756" height="604" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="764" y="694" font-size="12" text-anchor="end" fill="#64748B">Docker Compose 설치 · self-hosted</text>

  <!-- 브라우저 -->
  <rect x="242" y="12" width="320" height="60" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="402" y="37" font-size="15" font-weight="700" text-anchor="middle" fill="#312E81">관리자 브라우저</text>
  <text x="402" y="59" font-size="12" text-anchor="middle" fill="#3730A3">React + Vite 웹 (API가 정적 파일로 제공)</text>
  <line x1="402" y1="72" x2="402" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="90" font-size="11" fill="#64748B">127.0.0.1:3000 · 세션 쿠키</text>

  <!-- API 컨테이너 -->
  <rect x="40" y="112" width="724" height="350" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="60" y="137" font-size="14" font-weight="700" fill="#0F172A">api 컨테이너</text>
  <text x="152" y="137" font-size="12" fill="#475569">NestJS 단일 프로세스 · 읽기 전용 root</text>

  <rect x="60" y="150" width="684" height="32" rx="8" fill="#E2E8F0"/>
  <text x="402" y="171" font-size="12.5" text-anchor="middle" fill="#1E293B">전역 인증 guard · 설치/소유 범위 검사 · 요청 본문 크기 제한</text>

  <!-- 설정·관리 모듈 -->
  <g text-anchor="middle">
    <rect x="60" y="194" width="218" height="54" rx="8" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="169" y="215" font-size="13" font-weight="700" fill="#0F172A">인증</text>
    <text x="169" y="236" font-size="11.5" fill="#334155">최초 등록 · 로그인 · 로컬 토큰 복구</text>

    <rect x="293" y="194" width="218" height="54" rx="8" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="402" y="215" font-size="13" font-weight="700" fill="#0F172A">모델 연동 설정</text>
    <text x="402" y="236" font-size="11.5" fill="#334155">Key(암호화) · 전송 정책 · 모델 · 예산</text>

    <rect x="526" y="194" width="218" height="54" rx="8" fill="#ffffff" stroke="#CBD5E1"/>
    <text x="635" y="215" font-size="13" font-weight="700" fill="#0F172A">기본 Agent 설정</text>
    <text x="635" y="236" font-size="11.5" fill="#334155">목적 · 지침 · 용어 · 참조 문서</text>
  </g>

  <!-- 기능 모듈 -->
  <g font-size="12" fill="#334155" text-anchor="middle">
    <rect x="60" y="260" width="162" height="96" rx="8" fill="#ffffff" stroke="#94A3B8"/>
    <text x="141" y="283" font-size="13.5" font-weight="700" fill="#0F172A">파일 실행</text>
    <text x="141" y="305">등록 · 교체 · 삭제</text>
    <text x="141" y="323">추출 → 명시 색인</text>
    <text x="141" y="341">이력 · 중단 · 재시도</text>

    <rect x="234" y="260" width="162" height="96" rx="8" fill="#ffffff" stroke="#94A3B8"/>
    <text x="315" y="283" font-size="13.5" font-weight="700" fill="#0F172A">RAG 질문</text>
    <text x="315" y="305">mode 결정 · 혼합 검색</text>
    <text x="315" y="323">근거 패킷 → 인용 검증</text>
    <text x="315" y="341">대화 · 거절 · Gap 저장</text>

    <rect x="408" y="260" width="162" height="96" rx="8" fill="#ffffff" stroke="#94A3B8"/>
    <text x="489" y="283" font-size="13.5" font-weight="700" fill="#0F172A">첨부 작업</text>
    <text x="489" y="305">요약 · 질문 · 초안</text>
    <text x="489" y="323">공용 색인과 분리</text>
    <text x="489" y="341">소유자 전용 결과</text>

    <rect x="582" y="260" width="162" height="96" rx="8" fill="#ffffff" stroke="#94A3B8"/>
    <text x="663" y="283" font-size="13.5" font-weight="700" fill="#0F172A">운영</text>
    <text x="663" y="305">삭제 journal 재적용</text>
    <text x="663" y="323">보관 정리 · 진단 코드</text>
    <text x="663" y="341">readiness · 사용량</text>
  </g>

  <!-- 모듈 → 모델 실행 -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="141" y1="356" x2="141" y2="374"/>
    <line x1="315" y1="356" x2="315" y2="374"/>
    <line x1="489" y1="356" x2="489" y2="374"/>
  </g>

  <!-- ModelExecutionService -->
  <rect x="60" y="376" width="684" height="68" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="80" y="402" font-size="13.5" font-weight="700" fill="#78350F">ModelExecutionService</text>
  <text x="250" y="402" font-size="11.5" fill="#92400E">모든 유료 호출의 단일 경로 (임베딩 · 답변)</text>
  <text x="80" y="426" font-size="12" fill="#92400E">전송 정책 · Key · 모델 · 예산 검사 → 호출 ID·비용 원자적 예약 → 트랜잭션 밖에서 호출</text>

  <!-- 외부 공급자 -->
  <line x1="744" y1="410" x2="848" y2="410" stroke="#DB2777" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="786" y="400" font-size="10.5" fill="#9D174D">허용 시 전송</text>
  <rect x="850" y="352" width="196" height="116" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="948" y="378" font-size="14" font-weight="700" text-anchor="middle" fill="#831843">OpenAI API</text>
  <text x="948" y="397" font-size="11" text-anchor="middle" fill="#9D174D">외부 공급자 · 도입자 본인 Key</text>
  <text x="948" y="422" font-size="12" text-anchor="middle" fill="#831843">Responses · 답변</text>
  <text x="948" y="442" font-size="12" text-anchor="middle" fill="#831843">Embeddings · 1536차원</text>

  <!-- API → 저장소 -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="145" y1="462" x2="145" y2="498"/>
    <line x1="386" y1="462" x2="386" y2="498"/>
    <line x1="643" y1="462" x2="643" y2="498"/>
  </g>
  <g font-size="11" fill="#64748B">
    <text x="153" y="486">Prisma · townbase_runtime</text>
    <text x="394" y="486">파일 I/O</text>
    <text x="651" y="486">파일 실행 · 첨부가 요청</text>
  </g>

  <!-- 하단 저장소 -->
  <g text-anchor="middle" font-size="12">
    <rect x="40" y="500" width="210" height="132" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="145" y="525" font-size="13.5" font-weight="700" fill="#064E3B">PostgreSQL + pgvector</text>
    <text x="145" y="548" fill="#065F46">설치 · 관리자 · 세션 · 감사</text>
    <text x="145" y="566" fill="#065F46">파일 · 추출문 · 색인 조각</text>
    <text x="145" y="584" fill="#065F46">대화 · Gap · 첨부 결과</text>
    <text x="145" y="602" fill="#065F46">모델 호출 · 비용 예약</text>
    <text x="145" y="622" font-size="10.5" fill="#047857">API 계정은 열 단위 권한만</text>

    <rect x="266" y="500" width="240" height="132" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
    <text x="386" y="525" font-size="13.5" font-weight="700" fill="#0C4A6E">로컬 volume · secret</text>
    <text x="386" y="548" fill="#075985">documents · 원본 파일</text>
    <text x="386" y="566" fill="#075985">attachments · 첨부 원문(60분)</text>
    <text x="386" y="584" fill="#075985">operations · 삭제 journal · 진단</text>
    <text x="386" y="602" fill="#075985">bootstrap · recovery · 일회용 토큰</text>
    <text x="386" y="622" font-size="10.5" fill="#0369A1">secret: DB 암호 · model master key</text>

    <rect x="522" y="500" width="242" height="132" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="643" y="525" font-size="13.5" font-weight="700" fill="#4C1D95">격리 파서 프로세스</text>
    <text x="643" y="548" fill="#5B21B6">PDF · DOCX · MD · TXT 추출</text>
    <text x="643" y="566" fill="#5B21B6">pdf.js · Mammoth</text>
    <text x="643" y="584" fill="#5B21B6">PDF 괘선 표 복원</text>
    <text x="643" y="602" fill="#5B21B6">크기 · 시간 · 메모리 상한</text>
    <text x="643" y="622" font-size="10.5" fill="#6D28D9">초과 시 강제 종료</text>
  </g>

  <!-- migration -->
  <rect x="40" y="648" width="210" height="36" rx="8" fill="#ffffff" stroke="#059669" stroke-dasharray="4 3"/>
  <text x="145" y="671" font-size="12" text-anchor="middle" fill="#065F46">migration · 시작 시 1회 실행</text>
  <line x1="145" y1="648" x2="145" y2="634" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 운영자 CLI -->
  <rect x="820" y="540" width="226" height="120" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="933" y="565" font-size="13.5" font-weight="700" text-anchor="middle" fill="#0F172A">운영자 CLI (호스트)</text>
  <text x="933" y="588" font-size="12" text-anchor="middle" fill="#334155">prepare · secret 준비</text>
  <text x="933" y="606" font-size="12" text-anchor="middle" fill="#334155">backup · API 중지 후</text>
  <text x="933" y="624" font-size="12" text-anchor="middle" fill="#334155">암호화 snapshot · 복원</text>
  <text x="933" y="645" font-size="10.5" text-anchor="middle" fill="#64748B">docker로 DB · documents 접근</text>
  <line x1="820" y1="600" x2="782" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
